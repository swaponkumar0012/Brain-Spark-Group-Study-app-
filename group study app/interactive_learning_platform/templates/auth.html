{% extends "base.html" %}

{% block title %}Login / Join{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 50vh;">
    <div class="glass-panel" style="padding: 2.5rem; width: 100%; max-width: 400px; text-align: center;">

        <!-- Toggle Headers -->
        <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem;">
            <button onclick="showLogin()" id="loginBtn" class="btn" style="flex: 1;">Login</button>
            <button onclick="showRegister()" id="regBtn" class="btn btn-outline" style="flex: 1;">Join</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" method="POST" action="/auth">
            <h2 style="margin-bottom: 1.5rem;">Welcome Back</h2>
            <input type="hidden" name="action" value="login">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn" style="width: 100%;">Enter</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" method="POST" action="/auth" style="display: none;">
            <h2 style="margin-bottom: 1.5rem;">Start Learning</h2>
            <input type="hidden" name="action" value="register">
            <input type="text" name="username" placeholder="Choose Username" required>
            <input type="password" name="password" placeholder="Choose Password" required>
            <select name="role">
                <option value="student">I am a Student</option>
                <option value="teacher">I am a Teacher</option>
            </select>
            <button type="submit" class="btn" style="width: 100%;">Create Account</button>
        </form>

    </div>
</div>

<script>
    function showLogin() {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginBtn').className = 'btn';
        document.getElementById('regBtn').className = 'btn btn-outline';
    }

    function showRegister() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('loginBtn').className = 'btn btn-outline';
        document.getElementById('regBtn').className = 'btn';
    }
</script>
{% endblock %}
